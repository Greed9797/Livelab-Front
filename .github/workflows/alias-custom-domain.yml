name: Alias custom domain to latest prod

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployment hostname or URL to alias'
        required: true
        type: string
      domain:
        description: 'Custom domain'
        required: true
        default: 'app.grupolivelab.com.br'
        type: string

jobs:
  alias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checar secrets
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inspect domains + alias
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          # Normalize host
          HOST=$(echo "$DEPLOYMENT_URL" | sed -E 's#https?://##; s#/.*##')
          echo "Target deployment host: $HOST"
          echo "Custom domain: $DOMAIN"

          echo '=== project domains (API) ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin);
print(json.dumps([{k:x.get(k) for k in ("name","verified","gitBranch","redirect","apexName")} for x in d.get("domains",[])], indent=2))'

          echo '=== recent production deployments ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=5" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin);
print(json.dumps([{k:x.get(k) for k in ("uid","url","created","readyState","aliasError")} for x in d.get("deployments",[])], indent=2))'

          echo '=== alias set ==='
          vercel alias set "$HOST" "$DOMAIN" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

          echo '=== verify domain assignment ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/$DOMAIN?teamId=$VERCEL_ORG_ID" \
            | python3 -m json.tool | head -80
