name: Vercel Domain Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose Vercel domain ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Run diagnose script
        run: bash scripts/vercel-domain-diagnose.sh
      - name: Promote custom domain to PR18 deploy
        env:
          DEPLOY_ID: An6ny33Ys6ppaJMUL3xwqybb8Rvr
          DOMAIN: app.grupolivelab.com.br
        run: bash scripts/vercel-promote-custom-domain.sh
        # Domain may live on another Vercel team; capture exact API/CLI errors.
