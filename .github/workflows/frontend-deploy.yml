name: Frontend Deploy (Vercel)

on:
  push:
    branches: [migration/react-vercel]
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 'Only diagnose domain/project ownership (skip build/deploy)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: frontend-deploy-production
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_only == 'true' }}
    name: Diagnose Vercel domain ownership
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Whoami + teams + domain lookup
        run: |
          set -euo pipefail
          echo '=== whoami ==='
          vercel whoami --token "$VERCEL_TOKEN" || true

          echo '=== teams ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v2/teams' | python3 -m json.tool | head -120

          echo '=== configured project ==='
          echo "ORG=$VERCEL_ORG_ID PROJECT=$VERCEL_PROJECT_ID"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | python3 -c 'import sys,json; p=json.load(sys.stdin); print(json.dumps({k:p.get(k) for k in ("id","name","accountId","framework","targets")}, indent=2)[:2000])'

          echo '=== domains on configured project ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
            | python3 -m json.tool

          echo '=== domain app.grupolivelab.com.br global lookup ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v5/domains/app.grupolivelab.com.br' | python3 -m json.tool || true

          echo '=== domain grupolivelab.com.br ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v5/domains/grupolivelab.com.br' | python3 -m json.tool || true

          echo '=== list projects across teams for liveshop/livelab ==='
          # personal account projects
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v9/projects?limit=50' \
            | python3 -c 'import sys,json; d=json.load(sys.stdin);
print("personal:")
for p in d.get("projects",[]):
  n=p.get("name","")
  if any(x in n.lower() for x in ("live","shop","lab","grupo")):
    print(p.get("id"), n, p.get("accountId"))'

          # each team
          teams=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" 'https://api.vercel.com/v2/teams' | python3 -c 'import sys,json; print(" ".join(t["id"] for t in json.load(sys.stdin).get("teams",[])))')
          for tid in $teams; do
            echo "-- team $tid --"
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects?teamId=$tid&limit=50" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin);
for p in d.get("projects",[]):
  n=p.get("name","")
  if any(x in n.lower() for x in ("live","shop","lab","grupo")) or True:
    print(p.get("id"), n)'
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$tid" 2>/dev/null \
              | python3 -c 'import sys,json
try:
 d=json.load(sys.stdin)
 print("domains:", [x.get("name") for x in d.get("domains",[])])
except Exception as e:
 print("skip", e)' || true
          done

          echo '=== search domain assignments via alias API ==='
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v4/aliases?domain=app.grupolivelab.com.br&limit=10' | python3 -m json.tool | head -100 || true

  deploy:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnose_only == 'true') }}
    name: Verify + Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_URL: https://liveshop-saas-api-production.up.railway.app/v1
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checar secrets obrigatórios
        run: |
          missing=""
          if [ -z "$VERCEL_TOKEN" ]; then missing="$missing VERCEL_TOKEN"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then missing="$missing VERCEL_ORG_ID"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then missing="$missing VERCEL_PROJECT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Secrets do repositório faltando:$missing"
            exit 1
          fi
          echo "Secrets da Vercel presentes."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Type check
        working-directory: react-app
        run: npx tsc -b --noEmit

      - name: Unit tests
        working-directory: react-app
        run: npx vitest run

      - name: Build (validação, com VITE_API_URL embutida)
        working-directory: react-app
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Vercel pull (config de produção)
        working-directory: react-app
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Garantir VITE_API_URL no build da Vercel
        working-directory: react-app
        run: |
          ENV_FILE=.vercel/.env.production.local
          touch "$ENV_FILE"
          grep -v '^VITE_API_URL=' "$ENV_FILE" > "$ENV_FILE.tmp" || true
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          echo "VITE_API_URL=$VITE_API_URL" >> "$ENV_FILE"
          echo "VITE_API_URL embutida no build: $VITE_API_URL"

      - name: Vercel build (produção)
        working-directory: react-app
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Confirmar que a URL do backend entrou no bundle
        working-directory: react-app
        run: |
          if ! grep -rqF "liveshop-saas-api-production.up.railway.app" .vercel/output/static/assets/; then
            echo "::error::VITE_API_URL não foi embutida no bundle. Deploy abortado."
            exit 1
          fi
          echo "URL do backend Railway confirmada no bundle."

      - name: Vercel deploy (produção)
        working-directory: react-app
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
